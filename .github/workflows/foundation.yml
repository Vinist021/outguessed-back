name: Validação da fundação

on: [push, pull_request]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Formatação, dependências e compilação
        run: |
          gcc --version
          unformatted=$(gofmt -l .)
          if [[ -n $unformatted ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go mod verify
          go mod tidy -diff
          go vet ./...
          go vet -tags=integration ./...
          go build ./...
      - name: Testes unitários e contratos HTTP
        run: go test -race -count=1 ./...
      - name: Geração SQL, integração, recuperação e persistência
        run: bash scripts/verify-foundation.sh
      - name: Confirmar a árvore de trabalho
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [[ -n $changes ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi
