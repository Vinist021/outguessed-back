name: outguessed-back

services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: outguessed
      POSTGRES_PASSWORD: outguessed_local
      POSTGRES_DB: outguessed
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  redis:
    image: redis:8.2.11-bookworm
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: [tools]
    working_dir: /src
    volumes:
      - type: bind
        source: .
        target: /src
        bind:
          create_host_path: false

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: [tools]
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://outguessed:outguessed_local@postgres:5432/outguessed?sslmode=disable&search_path=public
    volumes:
      - type: bind
        source: ./db/migrations
        target: /migrations
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.34.1
    profiles: [docs]
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - type: bind
        source: ./docs/openapi.yaml
        target: /spec/openapi.yaml
        read_only: true
        bind:
          create_host_path: false

  postgres-test:
    image: postgres:18.7-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: outguessed_test
      POSTGRES_PASSWORD: outguessed_test_local
      POSTGRES_DB: outguessed_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  redis-test:
    image: redis:8.2.11-bookworm
    profiles: [test]
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  migrate-test:
    image: migrate/migrate:v4.20.1
    profiles: [test]
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://outguessed_test:outguessed_test_local@postgres-test:5432/outguessed_test?sslmode=disable&search_path=public
    volumes:
      - type: bind
        source: ./db/migrations
        target: /migrations
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
